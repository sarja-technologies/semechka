[project]
name = "semechka"
version = "0.4.0"
description = "Semechka — a configurable, private AI platform for your own infrastructure."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.121",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
semechka = "semechka.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["semechka*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.package-data]
semechka = ["web/**/*", "theme/*.json"]
